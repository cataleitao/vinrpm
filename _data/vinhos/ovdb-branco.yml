en:
  tipo: "White - Old Vines"
  descricao: "The recipe was on the trellis and in the hanging vines like music on a score written over eighty years ago. We picked the fruit and let the yeasts work, first macerating for eight days in the granite lagares and then in the Quinta’s old concrete tanks. The predominant grape varieties are Arinto and Azal. *Mic Drop*"
  ingredientes: "Grapes, contains sulphites"

pt:
  tipo: "Branco - Vinhas Velhas"
  descricao: "Overdub é trabalhar por cima. A receita estava na latada e nas vinhas de enforcado como música numa pauta escrita há mais de oitenta anos. Nós colhemos os frutos e deixamos as leveduras trabalhar, primeiro a macerar oito dias nos lagares de granito, e depois nas velhas cubas de cimento da quinta. As castas predominantes são a Pedernã e o Azal."
  ingredientes: "Uvas, contém sulfitos"
