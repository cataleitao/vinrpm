en:
  tipo: "White"
  descricao: "ANALOGUE captures the essence of the three predominant grape varieties on the estate: Arinto, Avesso, and Fernão Pires. Together, they produce a balanced, fresh wine with slight floral notes. The grapes were foot-tread on granite lagares and finished fermenting separately in the Quinta’s old concrete tanks."
  ingredientes: "Grapes, contains sulphites"

pt:
  tipo: "Branco"
  descricao: "ANALOGUE capta a essência das três castas predominantes na quinta: Arinto, Avesso e Fernão Pires. Juntas, produzem um vinho equilibrado e fresco, com ligeiras notas florais. As uvas foram pisadas a pé em lagares de granito e terminaram a fermentação separadamente nos antigos tanques de cimento da quinta."
  ingredientes: "Uvas, contém sulfitos"
