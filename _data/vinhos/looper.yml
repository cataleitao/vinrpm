en:
  tipo: "White - Pet Nat"
  descricao: "Off the beaten path, for our first approach to sparkling wines, we decided to create a wine that pays homage to the local tradition of allowing the malolactic conversion in the bottle. A blend of Arinto and Fernão Pires, the grapes were macerated separately for three days in our granite lagares and finished fermenting in stainless steel tanks."
  ingredientes: "Grapes, contains sulphites"

pt:
  tipo: "Branco - Pet Nat"
  descricao: "Decidimos que numa primeira etapa ficávamos de fora do ritmo e voltamos atrás apresentando um vinho que homenageia a tradição dos vinhos da região efetuarem a malolática dentro da garrafa. Um blend de Arinto e Fernão Pires, as uvas foram maceradas separadamente durante três dias nos nossos lagares de granito e terminaram a fermentação em cubas de inox."
  ingredientes: "Uvas, contém sulfitos"
